<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Weekly Menu | Mono Accent Dashboard</title>
<!-- Google Fonts: Manrope & Playfair Display -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- React and Babel -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "background": "#ffffff",
                "on-background": "#1a1a1a",
                "surface": "#fcfcfc",
                "on-surface": "#1a1a1a",
                "primary": "#1A1C1E",
                "on-primary": "#ffffff",
                "outline": "#e5e5e5",
                "accent": "#717171"
              },
              fontFamily: {
                "serif": ["Playfair Display", "serif"],
                "sans": ["Manrope", "sans-serif"]
              },
              borderRadius: {
                "DEFAULT": "8px"
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #ffffff;
            color: #1A1C1E;
            -webkit-font-smoothing: antialiased;
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-sans">
<div id="root"></div>
<script type="text/babel">
    const { useState, useMemo } = React;

    const WEEKLY_DATA = {
        'Monday': {
            ko: '월',
            lunch: '마파두부 & 계란볶음밥\n게살스프, 꿔바로우\n짜사이채무침, 배추김치',
            dinner: '설렁탕, 잡곡밥\n도톰한동그랑땡, 고춧잎무침\n석박지'
        },
        'Tuesday': {
            ko: '화',
            lunch: '대패삼겹 한판구이(삼겹+김치+콩나물)\n잡곡밥, 호박된장찌개\n양배추찜*쌈장, 깍두기',
            dinner: '뜨끈한 꼬치어묵전골\n우엉양념밥, 비엔나채소볶음\n브로콜리참깨무침, 배추김치'
        },
        'Wednesday': {
            ko: '수',
            lunch: '봉골레파스타, 콘스프\n미니함박스테이크, 두부카프레제\n오이피클 & 할라피뇨',
            dinner: '국물닭볶음탕, 잡곡밥\n어묵잡채, 돌자반볶음\n백김치'
        },
        'Thursday': {
            ko: '목',
            lunch: '간장돼지갈비찜, 잡곡밥\n순두부맑은국, 양념깻잎무침\n깍두기',
            dinner: '팟카파오무쌉 & 계란후라이\n쌀국수국물, 해물짜조*칠리\n쏨땀(태국식샐러드), 배추김치'
        },
        'Friday': {
            ko: '금',
            lunch: '반반소스오므라이스 & 그릴소시지\n유부장국, 어니언링튀김\n마카로니샐러드, 배추김치',
            dinner: '*건강한밥상*\n구수한 비지찌개, 소고기콩나물밥\n옛날소시지전, 시금치나물, 깍두기'
        },
        'Saturday': {
            ko: '토',
            lunch: '전주식콩나물국밥 & 수란\n잡곡밥, 고추장오리주물럭\n부추생채, 깍두기',
            dinner: '장조림버터돌솥밥, 미니우동\n크런치생선가스, 고추지무침\n배추김치'
        },
        'Sunday': {
            ko: '일',
            lunch: '매콤해물순두부찌개, 잡곡밥\n잡채, 콩나물무침\n배추김치',
            dinner: '카레라이스, 맑은미역국\n가라아게튀김, 단무지무침\n깍두기'
        }
    };

    const DAYS = Object.keys(WEEKLY_DATA);

    const App = () => {
        const [activeDay, setActiveDay] = useState('Monday');
        const currentMenu = useMemo(() => WEEKLY_DATA[activeDay], [activeDay]);

        return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 sm:p-12 bg-background">
                <div className="max-w-4xl w-full">
                    {/* Brand Title */}
                    <header className="text-center mb-16">
                        <h1 className="font-serif italic text-xs tracking-[0.4em] uppercase text-accent mb-6">
                            The Curator's Table
                        </h1>
                        <h2 className="font-serif text-5xl md:text-6xl font-normal tracking-tight text-primary">
                            Weekly Menu
                        </h2>
                    </header>

                    {/* Circular Navigation Buttons */}
                    <nav className="mb-20">
                        <div className="flex justify-center items-center gap-4 sm:gap-6 md:gap-8 overflow-x-auto py-4 no-scrollbar">
                            {DAYS.map(day => (
                                <button 
                                    key={day}
                                    onClick={() => setActiveDay(day)}
                                    className={`relative flex-shrink-0 flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full border transition-all duration-500 group
                                        ${activeDay === day 
                                            ? 'bg-primary border-primary text-white shadow-lg' 
                                            : 'bg-transparent border-outline text-accent hover:border-primary hover:text-primary'}`}
                                >
                                    <div className="flex flex-col items-center">
                                        <span className="text-[9px] uppercase tracking-tighter mb-0.5 opacity-60">
                                            {day.substring(0, 3)}
                                        </span>
                                        <span className="text-lg font-serif italic leading-none">
                                            {WEEKLY_DATA[day].ko}
                                        </span>
                                    </div>
                                    {activeDay === day && (
                                        <span className="absolute -bottom-2 w-1 h-1 bg-primary rounded-full"></span>
                                    )}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Content Section - Two Columns */}
                    <main key={activeDay} className="grid md:grid-cols-2 gap-16 md:gap-24 min-h-[300px] animate-fade-in-up">
                        {/* Lunch Column */}
                        <section className="flex flex-col text-center">
                            <div className="mb-8 relative">
                                <h3 className="font-serif italic text-3xl text-primary mb-2">Lunch</h3>
                                <div className="w-12 h-[1px] bg-outline mx-auto mb-3"></div>
                                <p className="text-[11px] tracking-[0.2em] text-accent font-medium uppercase">
                                    12:00 ~ 13:00
                                </p>
                            </div>
                            <div className="flex-1 flex flex-col justify-center">
                                <p className="font-sans font-light leading-relaxed text-lg md:text-xl text-primary/80 whitespace-pre-line px-4">
                                    {currentMenu.lunch}
                                </p>
                            </div>
                        </section>

                        {/* Dinner Column */}
                        <section className="flex flex-col text-center">
                            <div className="mb-8 relative">
                                <h3 className="font-serif italic text-3xl text-primary mb-2">Dinner</h3>
                                <div className="w-12 h-[1px] bg-outline mx-auto mb-3"></div>
                                <p className="text-[11px] tracking-[0.2em] text-accent font-medium uppercase">
                                    18:00 ~ 19:00
                                </p>
                            </div>
                            <div className="flex-1 flex flex-col justify-center">
                                <p className="font-sans font-light leading-relaxed text-lg md:text-xl text-primary/80 whitespace-pre-line px-4">
                                    {currentMenu.dinner}
                                </p>
                            </div>
                        </section>
                    </main>

                    {/* Footer Accent */}
                    <footer className="mt-24 pt-12 border-t border-outline/30 text-center">
                        <p className="text-[10px] uppercase tracking-[0.4em] text-accent/60 font-medium">
                            Est. 2024 &copy; Mono Accent Editorial
                        </p>
                    </footer>
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body></html>
